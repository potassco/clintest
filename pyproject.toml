[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clintest"
version = "0.6.0"
authors = [
    {name = "Tobias Stolzmann", email = "tobias.stolzmann@uni-potsdam.de"},
]
description = "A test framework for clingo programs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "clingo~=5.8",
]

[project.optional-dependencies]
dev = [
    "mypy~=2.4",
    "pydoclint~=0.11.0",
    "pytest~=9.1",
    "ruff~=0.16.10",
]
doc = [
    "mkdocstrings-python~=2.0",
    "zensical==0.0.68",
]

[project.urls]
Homepage = "https://potassco.org/clintest/"
Source = "https://github.com/potassco/clintest"
Changelog = "https://github.com/potassco/clintest/releases"
Documentation = "https://docs.potassco.org/clintest/"
Issues = "https://github.com/potassco/clintest/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
check-style-mismatch = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "PL",   # pylint
    "B",    # bugbear
    "S",    # bandit
    "E",    # pycodestyle: errors
    "W",    # pycodestyle: warnings
    "D",    # pydocstyle
    "I",    # isort
]
ignore = [
    "D105", # pydocstyle: missing docstring in magic method
    "E501", # pycodestyle: line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"
