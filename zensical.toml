[project]
site_url = "https://docs.potassco.org/clintest/"
site_name = "clintest"
site_description = "A test framework for clingo programs"
site_author = "Tobias Stolzmann"

copyright = "Copyright &copy; 2023 Tobias Stolzmann"

repo_url = "https://github.com/potassco/clintest"
repo_name = "potassco/clintest"

nav = [
  { "Guide" = [
    { "Getting Started" = "guide/getting_started.md" },
  ] },
  { "Reference" = [
    { "clintest" = "reference/clintest/__init__.md" },
    { "clintest.assertion" = "reference/clintest/assertion.md" },
    { "clintest.outcome" = "reference/clintest/outcome.md" },
    { "clintest.protocol" = "reference/clintest/protocol.md" },
    { "clintest.quantifier" = "reference/clintest/quantifier.md" },
    { "clintest.solver" = "reference/clintest/solver.md" },
    { "clintest.test" = "reference/clintest/test.md" },
  ] }
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "."
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
modernize_annotations = true
show_signature_annotations = true
separate_signature = true

[project.plugins.redirects.redirect_maps]
"index.md" = "guide/getting_started.md"
"guide/index.md" = "guide/getting_started.md"
"reference/index.md" = "reference/clintest/__init__.md"
